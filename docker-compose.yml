services:

  # ============================================================
  # FASTAPI + CELERY
  # ============================================================

  backend:
    build: ./backend

    # Single-server parity with prod (root Dockerfile -> start-single.sh):
    # FastAPI + Celery worker in ONE container sharing one filesystem.
    # The supervisor exits (and compose restarts us) if EITHER child dies,
    # so a dead worker can never sit silent while uploads pile in 'queued'.
    command: sh ./start-single.sh

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/code
      - uploads_data:/code/uploads

    env_file:
      - .env

    dns:
      - 8.8.8.8
      - 1.1.1.1

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped


# ============================================================
# VOLUMES
# ============================================================

volumes:
  redis_data:
  uploads_data: