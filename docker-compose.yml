services:

  # ============================================================
  # FASTAPI + CELERY
  # ============================================================

  backend:
    build: ./backend

    # Starts FastAPI and Celery in the same container
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 & celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=1 & wait"

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/code
      - uploads_data:/code/uploads

    env_file:
      - .env

    dns:
      - 8.8.8.8
      - 1.1.1.1

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped


# ============================================================
# VOLUMES
# ============================================================

volumes:
  redis_data:
  uploads_data: